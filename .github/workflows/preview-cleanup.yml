name: Preview cleanup

# Deleting a branch deletes its Workers Preview (named as in the CI preview job).
on:
  delete:

permissions:
  contents: read

jobs:
  delete-preview:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CLOUDFLARE == 'true'
      - name: Delete Worker Preview
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.ref }}
        run: npx wrangler preview delete --name "$(scripts/preview-name.sh "$BRANCH")" --skip-confirmation
