name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SING_BOX_VERSION: 1.14.3

jobs:
  test:
    name: Tests, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  sing-box-check:
    name: sing-box check (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Linux also covers the auto_redirect config; Windows and macOS cover platform-specific init.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Download sing-box ${{ env.SING_BOX_VERSION }} (checksum verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "SING_BOX=$(python scripts/fetch-sing-box.py "$SING_BOX_VERSION" "$RUNNER_TEMP/sing-box")" >> "$GITHUB_ENV"
      - run: npm run check:singbox

  # Deploys are Cloudflare's: Workers Builds (connected to this repo in the Cloudflare dashboard)
  # deploys main to production and every other branch as a Preview. A version tag, once tests and
  # sing-box checks pass, creates the GitHub release with a dist/ archive for self-hosting.
  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, sing-box-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="singbox-confgen-$GITHUB_REF_NAME.zip"
          (cd dist && zip -qr "../$archive" .)
          gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
